# SMT Analytics uses the installed PHP 8.4 CGI runtime.
ScriptAlias /smt-php-runtime/ "C:/Program Files/php-8.4.14/"
<Directory "C:/Program Files/php-8.4.14">
    Options +ExecCGI -Indexes
    AllowOverride None
    Require all denied
    <Files "php-cgi.exe">
        Require all granted
    </Files>
    SetEnv PHPRC "C:/Users/arjun/OneDrive/Desktop/Pending Projects/smt_analysis/smt_analysis/deploy"
</Directory>
Alias /smt_analysis "C:/Users/arjun/OneDrive/Desktop/Pending Projects/smt_analysis/smt_analysis/public"
<Directory "C:/Users/arjun/OneDrive/Desktop/Pending Projects/smt_analysis/smt_analysis/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    SetEnv PHPRC "C:/Users/arjun/OneDrive/Desktop/Pending Projects/smt_analysis/smt_analysis/deploy"
    <FilesMatch "\.php$">
        SetHandler smt-php84
    </FilesMatch>
    Action smt-php84 /smt-php-runtime/php-cgi.exe
</Directory>
